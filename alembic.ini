# Alembic configuration for Applination.
#
# The database URL is NOT set here — env.py reads it from server.db.database_url()
# so the app, the CLI, and migrations can never disagree about which database
# they are talking to. Set DATABASE_URL in the environment instead.
#
#   alembic upgrade head                      # apply migrations
#   alembic revision --autogenerate -m "..."  # after changing a model
#   alembic downgrade -1                      # step back one

[alembic]
script_location = server/migrations
prepend_sys_path = .
path_separator = os

# Revision filenames sort chronologically, which makes the versions/ directory
# readable as a timeline rather than a bag of hashes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
