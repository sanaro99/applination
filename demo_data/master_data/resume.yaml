# =====================================================================
# MASTER RESUME - the demo persona, John Doe. Entirely fictional.
#
# Committed on purpose: server/demo.py copies this into the demo account's
# data/users/<id>/master_data/resume.yaml on every re-seed. Edit it here.
#
# The employers and school below are invented. A real company must never
# appear to have employed a person who does not exist - this repository is
# public. Real companies appear in demo_data/ only as public job postings.
# =====================================================================

# Pinned rather than derived. The derivation in src/profile.py counts any role
# without "intern" in the title as full-time, which would read the teaching
# assistantship as professional experience and describe a final-year student
# as a professional.
