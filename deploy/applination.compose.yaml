# Applination — Sanchit-Cloud Seattle
#
# Paste into TrueNAS: Apps -> Discover -> ⋮ (top right) -> Install via YAML,
# app name "applination".
#
# Host ports: 3001 web, 3002 api. Both bind loopback only — the sole public
# path is Cloudflare Tunnel -> Traefik :443 -> here.
#
# PREREQUISITES (do these first, in order):
#   1. /mnt/apps-pool/appconfig/applination.env exists (chmod 600) and sets
#      POSTGRES_PASSWORD and DATABASE_URL (see applination.env.example)
#   2. /mnt/apps-pool/appconfig/applination/data exists and holds your migrated
#      per-user tree (data/users/<id>/{config.yaml,master_data,output}) — see
#      scripts/migrate_to_multiuser.py and Step 7 of docs/DEPLOY-SEATTLE.md
#   3. /mnt/apps-pool/appconfig/applination/pgdata exists (empty is fine —
#      Postgres initialises it on first boot)
# Compose refuses to start if env_file or a bind source is missing.

services:
  # Postgres replaced the old SQLite file at data/app.db. It is deliberately
  # NOT published to a host port: the only client is applination-api on the
  # internal compose network. Reach it for maintenance with
  # `docker compose exec applination-db psql -U applination`.
  applination-db:
    # Pinned to the same major version used in local development, so what gets
    # tested is what ships. Bumping the major version means a dump/restore —
    # Postgres will not start against a data directory from an older major.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: applination
      POSTGRES_DB: applination
      TZ: America/Los_Angeles
    # POSTGRES_PASSWORD comes from here, not a top-level ${VAR} default in
    # `environment:` above — that syntax is resolved by Compose at YAML-parse
    # time from the shell/project .env, which TrueNAS's "Install via YAML"
    # apps do not populate from this file. env_file: injects it straight into
    # the container instead, the same mechanism applination-api already uses.
    env_file:
      - /mnt/apps-pool/appconfig/applination.env
    volumes:
      # Mounted at the *parent* directory, not .../data. Since the postgres:18
      # image, the entrypoint stores data in a version-namespaced subdirectory
      # (e.g. /var/lib/postgresql/18/docker) under a single parent mount, so a
      # future major-version bump can use `pg_upgrade --link` — both the old
      # and new version's data need to be visible under one mount for that.
      # Mounting directly at .../data (the pre-18 layout) makes the image
      # refuse to start: see docker-library/postgres#1259.
      - /mnt/apps-pool/appconfig/applination/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applination -d applination"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Watchtower is intentionally NOT enabled here. An unattended major-version
    # bump of Postgres will not start against an old data directory, and that
    # would take the app down with no one watching.
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  applination-api:
    image: ghcr.io/sanaro99/applination-api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:8000"
    env_file:
      - /mnt/apps-pool/appconfig/applination.env
    depends_on:
      applination-db:
        condition: service_healthy
    volumes:
      # Personal state lives on ZFS, never in the image.
      #
      # One mount, not four. Since PR 3 every user's config.yaml, master_data
      # and output live under data/users/<id>/, so the separate config.yaml,
      # master_data and output mounts have nothing left to bind — and leaving
      # them would shadow the repo's committed master_data/guidelines and
      # master_data/templates, which are read globally for every user.
      - /mnt/apps-pool/appconfig/applination/data:/app/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  applination-web:
    image: ghcr.io/sanaro99/applination-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      NODE_ENV: production
      TZ: America/Los_Angeles
    depends_on:
      - applination-api
    labels:
      com.centurylinklabs.watchtower.enable: "true"
